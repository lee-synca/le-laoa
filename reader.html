<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reader — Le Laoa</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Alegreya+Sans:ital,wght@0,400;0,500;0,700;0,800;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<style>
  body { background: #1a1209; }
  .reader-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
    padding: 18px 0;
  }
  .reader-bar h1 {
    margin: 0;
    font-family: var(--display);
    font-weight: 400;
    font-size: 22px;
    color: #f3e9d2;
  }
  .reader-controls { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .reader-btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: rgba(243,233,210,0.10);
    border: 1px solid rgba(243,233,210,0.25);
    color: #f3e9d2;
    font-family: var(--body);
    font-size: 15px;
    font-weight: 700;
    padding: 9px 18px;
    border-radius: 999px;
    cursor: pointer;
  }
  .reader-btn:hover { background: rgba(243,233,210,0.18); color: #f3e9d2; }
  .reader-btn:disabled { opacity: 0.4; cursor: default; }
  .page-indicator { font-size: 15px; color: #cdbb9b; min-width: 90px; text-align: center; }
  .page-stage {
    display: flex;
    justify-content: center;
    padding: 8px 0 40px;
  }
  #pdf-canvas {
    max-width: 100%;
    height: auto;
    border-radius: 6px;
    box-shadow: 0 18px 50px rgba(0,0,0,0.55);
    background: #fff;
  }
  .reader-note { text-align: center; color: #a89475; font-size: 15px; padding: 60px 20px; }
</style>
</head>
<body>

<nav class="site-nav">
  <div class="container">
    <a class="brand" href="index.html">
      <span class="brand-name">LE LAOA</span>
      <span class="brand-sub">Descendants of Su'e Tu'ulau</span>
    </a>
    <button class="nav-toggle" id="nav-toggle" aria-label="Menu">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none"><path d="M4 6.5h16M4 12h16M4 17.5h16" stroke="#f3e9d2" stroke-width="1.8" stroke-linecap="round"/></svg>
    </button>
    <div class="nav-links" id="nav-links">
      <a href="index.html">Home</a>
      <a href="videos.html">Videos</a>
      <a href="index.html#ebooks" class="active">E-books</a>
      <a href="about.html">About</a>
    </div>
  </div>
</nav>

<div class="container">
  <div class="reader-bar">
    <h1 id="book-title">Loading&hellip;</h1>
    <div class="reader-controls">
      <button class="reader-btn" id="prev" aria-label="Previous page">
        <svg width="14" height="14" viewBox="0 0 16 16" fill="none"><path d="M10 3.5 5.5 8 10 12.5" stroke="#f3e9d2" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Back
      </button>
      <span class="page-indicator" id="page-indicator">&ndash; / &ndash;</span>
      <button class="reader-btn" id="next" aria-label="Next page">
        Next
        <svg width="14" height="14" viewBox="0 0 16 16" fill="none"><path d="M6 3.5 10.5 8 6 12.5" stroke="#f3e9d2" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <a class="reader-btn" id="download-link" href="#" download>
        <svg width="14" height="14" viewBox="0 0 16 16" fill="none"><path d="M8 2v8m0 0 3.2-3.2M8 10 4.8 6.8M2.5 13.5h11" stroke="#f3e9d2" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Download
      </a>
    </div>
  </div>
  <div class="page-stage">
    <canvas id="pdf-canvas"></canvas>
  </div>
  <div class="reader-note" id="reader-note" style="display:none">
    The reader couldn't load this book. You can still
    <a id="fallback-link" href="#" style="color:#e0b478">download the PDF</a> and read it on your device.
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
  document.getElementById('nav-toggle').addEventListener('click', function () {
    document.getElementById('nav-links').classList.toggle('open');
  });

  (function () {
    var BOOKS = {
      tusi: { title: "Tusi Fa'alupega", file: 'assets/Tusi-Faalupega.pdf' },
      gafa: { title: "Gafa Fa'avae ole Suafa Li'o", file: 'assets/Gafa-Faavae-ole-Suafa-Lio.pdf' }
    };
    var key = (new URLSearchParams(location.search).get('book') || 'tusi').toLowerCase();
    var book = BOOKS[key] || BOOKS.tusi;

    document.getElementById('book-title').textContent = book.title;
    document.title = book.title + ' — Le Laoa';
    document.getElementById('download-link').href = book.file;
    document.getElementById('fallback-link').href = book.file;

    var canvas = document.getElementById('pdf-canvas');
    var ctx = canvas.getContext('2d');
    var indicator = document.getElementById('page-indicator');
    var prevBtn = document.getElementById('prev');
    var nextBtn = document.getElementById('next');

    var pdfDoc = null;
    var pageNum = 1;
    var rendering = false;
    var pending = null;

    function renderPage(num) {
      rendering = true;
      pdfDoc.getPage(num).then(function (page) {
        var container = document.querySelector('.page-stage');
        var maxWidth = Math.min(container.clientWidth, 900);
        var viewport = page.getViewport({ scale: 1 });
        var scale = maxWidth / viewport.width;
        var outputScale = window.devicePixelRatio || 1;
        viewport = page.getViewport({ scale: scale });
        canvas.width = Math.floor(viewport.width * outputScale);
        canvas.height = Math.floor(viewport.height * outputScale);
        canvas.style.width = Math.floor(viewport.width) + 'px';
        canvas.style.height = Math.floor(viewport.height) + 'px';
        var transform = outputScale !== 1 ? [outputScale, 0, 0, outputScale, 0, 0] : null;
        page.render({ canvasContext: ctx, transform: transform, viewport: viewport }).promise.then(function () {
          rendering = false;
          if (pending !== null) { var p = pending; pending = null; renderPage(p); }
        });
      });
      indicator.textContent = num + ' / ' + pdfDoc.numPages;
      prevBtn.disabled = num <= 1;
      nextBtn.disabled = num >= pdfDoc.numPages;
    }

    function queueRender(num) {
      if (rendering) { pending = num; } else { renderPage(num); }
    }

    function go(delta) {
      if (!pdfDoc) return;
      var n = pageNum + delta;
      if (n < 1 || n > pdfDoc.numPages) return;
      pageNum = n;
      queueRender(pageNum);
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    prevBtn.addEventListener('click', function () { go(-1); });
    nextBtn.addEventListener('click', function () { go(1); });
    document.addEventListener('keydown', function (e) {
      if (e.key === 'ArrowLeft') go(-1);
      if (e.key === 'ArrowRight') go(1);
    });

    // Simple swipe support for phones.
    var touchX = null;
    document.addEventListener('touchstart', function (e) { touchX = e.touches[0].clientX; }, { passive: true });
    document.addEventListener('touchend', function (e) {
      if (touchX === null) return;
      var dx = e.changedTouches[0].clientX - touchX;
      if (Math.abs(dx) > 60) go(dx < 0 ? 1 : -1);
      touchX = null;
    }, { passive: true });

    var resizeTimer = null;
    window.addEventListener('resize', function () {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(function () { if (pdfDoc) queueRender(pageNum); }, 200);
    });

    if (!window.pdfjsLib) {
      document.getElementById('reader-note').style.display = 'block';
      return;
    }
    pdfjsLib.GlobalWorkerOptions.workerSrc =
      'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    pdfjsLib.getDocument(book.file).promise.then(function (doc) {
      pdfDoc = doc;
      renderPage(pageNum);
    }).catch(function () {
      document.querySelector('.page-stage').style.display = 'none';
      document.getElementById('reader-note').style.display = 'block';
    });
  })();
</script>
</body>
</html>
