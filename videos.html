<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Video Library — Le Laoa</title>
<meta name="description" content="Watch the Le Laoa family videos right on the site — aganu'u, gafa, lauga, tala o le vavau and taumafa fa'asamoa, recorded by family members.">
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Alegreya+Sans:ital,wght@0,400;0,500;0,700;0,800;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav class="site-nav">
  <div class="container">
    <a class="brand" href="index.html">
      <span class="brand-name">LE LAOA</span>
      <span class="brand-sub">Descendants of Su'e Tu'ulau</span>
    </a>
    <button class="nav-toggle" id="nav-toggle" aria-label="Menu">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none"><path d="M4 6.5h16M4 12h16M4 17.5h16" stroke="#f3e9d2" stroke-width="1.8" stroke-linecap="round"/></svg>
    </button>
    <div class="nav-links" id="nav-links">
      <a href="index.html">Home</a>
      <a href="videos.html" class="active">Videos</a>
      <a href="index.html#ebooks">E-books</a>
      <a href="about.html">About</a>
    </div>
  </div>
</nav>

<header class="page-head">
  <div class="container">
    <div class="eyebrow">The video library</div>
    <h1>Watch, right here</h1>
    <p>Every video plays on this page — no need to leave the site. Choose a collection, or browse everything.</p>
    <div class="tabs" id="tabs"></div>
  </div>
</header>

<section class="player-band" id="player-section">
  <div class="container">
    <div>
      <div class="player-frame" id="player"></div>
      <div class="player-meta">
        <div class="title-row">
          <h2 id="player-title"></h2>
          <span class="player-chip" id="player-chip"></span>
          <span class="duration" id="player-duration"></span>
        </div>
      </div>
    </div>
    <aside class="up-next">
      <div class="up-next-title">UP NEXT</div>
      <div id="up-next" style="display:flex;flex-direction:column;gap:16px"></div>
    </aside>
  </div>
</section>

<section class="section" style="padding-top:64px">
  <div class="container">
    <div class="section-head">
      <h2>All videos</h2>
      <span style="color:#6b5a47" id="grid-count"></span>
    </div>
    <div class="video-grid" id="video-grid"></div>
  </div>
</section>

<footer class="site-footer">
  <div class="container">
    <div class="footer-bottom" style="border-top:0">
      <span>&copy; Le Laoa &middot; For the descendants of Su'e Tu'ulau</span>
    </div>
  </div>
</footer>

<script src="js/videos-data.js"></script>
<script src="js/videos.js"></script>
<script>
  document.getElementById('nav-toggle').addEventListener('click', function () {
    document.getElementById('nav-links').classList.toggle('open');
  });
</script>
</body>
</html>
